<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محلل البيانات التفاعلي | Interactive Data Analyzer</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--pri:#2563eb;--pri2:#1d4ed8;--soft:#eff6ff;
--ok:#166534;--okbg:#dcfce7;--err:#991b1b;--errbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic",Tahoma,Arial,system-ui,sans-serif;line-height:1.6;font-size:15px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{font-size:30px}
.top h1{margin:0;font-size:20px;line-height:1.3}
.top p{margin:0;font-size:13px;opacity:.88}
main{max-width:1240px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.08);padding:18px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:17px;color:var(--pri2)}
.card h3{margin:16px 0 8px;font-size:15px}
textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;font:14px/1.5 Consolas,"Courier New",monospace,"Segoe UI",Tahoma;background:#f8fafc;color:var(--ink)}
textarea:focus,input:focus,select:focus{outline:2px solid #93c5fd;border-color:var(--pri)}
input[type=text],input[type=search],select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit}
label>span{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--soft);border-color:#93c5fd}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.primary:hover{background:var(--pri2)}
.btn.ghost{background:transparent;border-color:rgba(148,163,184,.6)}
.top .btn.ghost{color:#fff;border-color:rgba(255,255,255,.55)}
.top .btn.ghost:hover{background:rgba(255,255,255,.15)}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
.pre{white-space:pre-line}
.msg{margin-top:12px;padding:10px 14px;border-radius:10px;font-weight:600;white-space:pre-line}
.msg.ok{background:var(--okbg);color:var(--ok)}
.msg.err{background:var(--errbg);color:var(--err)}
.msg.warn{background:var(--warnbg);color:var(--warn)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{background:var(--soft);border-radius:12px;padding:14px;border:1px solid #dbeafe}
.stat .lbl{font-size:13px;color:var(--muted)}
.stat .val{font-size:26px;font-weight:700;color:var(--pri2);line-height:1.3}
.stat .sub{font-size:12px;color:var(--muted)}
.tablewrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
th{background:#f8fafc;position:sticky;top:0;z-index:2;font-weight:700}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:var(--soft)}
tbody tr:nth-child(even){background:#fafcff}
tbody tr:hover{background:var(--soft)}
td.num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.tag{padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
.tag.number{background:#dbeafe;color:#1e40af}
.tag.text{background:#e2e8f0;color:#334155}
.tag.date{background:#fef3c7;color:#92400e}
ul#insights{margin:0;padding-inline-start:20px}
ul#insights li{margin:4px 0}
.chartbox{position:relative;height:350px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid #bfdbfe;color:#1e3a8a;padding:4px 6px 4px 12px;border-radius:999px;font-size:13px}
.chip button{border:0;background:#bfdbfe;color:#1e3a8a;border-radius:50%;width:22px;height:22px;cursor:pointer;font-weight:700;line-height:1}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.bar select{width:auto}
.pager{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap}
mark{background:#fde68a;border-radius:3px;padding:0 1px}
@media (max-width:640px){.top h1{font-size:16px}.top p{display:none}main{padding:10px}.card{padding:14px}.stat .val{font-size:22px}.inline{flex-direction:column}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">📊</span><div><h1 data-i18n="appTitle"></h1><p data-i18n="appSub"></p></div></div>
  <button id="langBtn" class="btn ghost" type="button" aria-label="Language"></button>
</header>
<main>
  <section class="card">
    <h2 data-i18n="secInput"></h2>
    <textarea id="raw" spellcheck="false" dir="auto" data-i18n-ph="ph"></textarea>
    <div class="row">
      <button id="btnAnalyze" class="btn primary" type="button" data-i18n="btnAnalyze"></button>
      <label class="btn" for="file" data-i18n="btnFile"></label>
      <input id="file" type="file" accept=".csv,.tsv,.txt,.tab,text/csv,text/plain,text/tab-separated-values" hidden>
      <button id="btnSample" class="btn" type="button" data-i18n="btnSample"></button>
      <button id="btnClear" class="btn ghost" type="button" data-i18n="btnClear"></button>
    </div>
    <p class="hint" data-i18n="privacy"></p>
    <div id="msg" class="msg" role="alert" hidden></div>
  </section>

  <div id="app" hidden>
    <section class="card"><h2 data-i18n="secOverview"></h2><div id="cards" class="cards"></div></section>

    <section class="card"><h2 data-i18n="secColumns"></h2><div class="tablewrap"><table id="colTable"></table></div></section>

    <section class="card"><h2 data-i18n="secInsights"></h2><ul id="insights"></ul></section>

    <section class="card">
      <h2 data-i18n="secChart"></h2>
      <div class="grid">
        <label><span data-i18n="lblChType"></span>
          <select id="chType">
            <option value="bar" data-i18n="chBar"></option>
            <option value="line" data-i18n="chLine"></option>
            <option value="pie" data-i18n="chPie"></option>
            <option value="doughnut" data-i18n="chDoughnut"></option>
            <option value="hist" data-i18n="chHist"></option>
          </select></label>
        <label><span data-i18n="lblChCol"></span><select id="chCol"></select></label>
        <label><span data-i18n="lblChVal"></span><select id="chVal"></select></label>
        <label><span data-i18n="lblChAgg"></span>
          <select id="chAgg">
            <option value="sum" data-i18n="aggSum"></option>
            <option value="avg" data-i18n="aggAvg"></option>
            <option value="min" data-i18n="aggMin"></option>
            <option value="max" data-i18n="aggMax"></option>
          </select></label>
        <label><span data-i18n="lblChTop"></span>
          <select id="chTop"><option>5</option><option selected>10</option><option>20</option><option>50</option></select></label>
      </div>
      <div class="chartbox" id="chartBox"><canvas id="chart"></canvas></div>
      <p class="hint" id="chartNote"></p>
    </section>

    <section class="card">
      <h2 data-i18n="secQuery"></h2>
      <label><span data-i18n="lblSearch"></span><input id="search" type="search" dir="auto" data-i18n-ph="phSearch"></label>
      <div style="margin-top:12px">
        <label><span data-i18n="lblNL"></span>
          <div class="inline"><input id="nl" type="text" dir="auto" data-i18n-ph="phNL"><button id="nlGo" class="btn primary" type="button" data-i18n="nlGo"></button></div>
        </label>
        <p class="hint pre" id="nlHint"></p>
      </div>
      <h3 data-i18n="lblFilters"></h3>
      <div class="grid">
        <label><span data-i18n="lblFCol"></span><select id="fCol"></select></label>
        <label><span data-i18n="lblFOp"></span><select id="fOp"></select></label>
        <label><span data-i18n="lblFV1"></span><input id="fV1" type="text" dir="auto"></label>
        <label id="fV2wrap" hidden><span data-i18n="lblFV2"></span><input id="fV2" type="text" dir="auto"></label>
        <div><button id="fAdd" class="btn" type="button" data-i18n="fAdd"></button></div>
      </div>
      <div id="chips" class="chips"></div>
      <div class="grid">
        <label><span data-i18n="lblSort"></span><select id="sortCol"></select></label>
        <label><span data-i18n="lblSortDir"></span>
          <select id="sortDir"><option value="1" data-i18n="asc"></option><option value="-1" data-i18n="desc"></option></select></label>
        <label><span data-i18n="lblGroup"></span><select id="grpCol"></select></label>
        <label><span data-i18n="lblMeasure"></span><select id="grpMeasure"></select></label>
      </div>
    </section>

    <section class="card" id="groupCard" hidden>
      <div class="bar"><h2 style="margin:0" data-i18n="secGroup"></h2><button id="gClose" class="btn" type="button" data-i18n="gClose"></button></div>
      <p class="hint" id="gNote"></p>
      <div class="tablewrap"><table id="groupTable"></table></div>
    </section>

    <section class="card">
      <h2 data-i18n="secTable"></h2>
      <div class="bar">
        <span id="tInfo" class="hint" style="margin:0"></span>
        <span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <select id="perPage" aria-label="per page"><option>25</option><option selected>50</option><option>100</option><option>200</option></select>
          <button id="btnExport" class="btn" type="button" data-i18n="exportBtn"></button>
        </span>
      </div>
      <div class="tablewrap"><table id="dataTable"></table></div>
      <div class="pager" id="pager"></div>
    </section>
  </div>
</main>

    }else{

  const cols=[],used=new Set(),hdr=rows[0];

function getCmp(c,r,v){

      case 'notequals':return !hay.some(x=>x===v);

      case 'ends':return hay.some(x=>x.endsWith(v)&&x!=='');

    }

  const nv=S.nr[r][c],a=norm(f.v1);
  switch(op){
    case 'contains':return nv.indexOf(a)>=0;
    case 'notcontains':return nv.indexOf(a)<0;
    case 'starts':return nv.startsWith(a);
    case 'ends':return nv.endsWith(a);
    case 'equals':case 'notequals':{
      let eq;const ty=S.types[c];

    if(col!=='*'&&NUMOPS.concat(['equals','notequals']).indexOf(op)>=0){
      const ty=S.types[col];
      if(ty==='number'){f.v1=cleanNum(f.v1);f.v2=cleanNum(f.v2);}
      else if(ty==='date'){f.v1=cleanDate(f.v1);f.v2=cleanDate(f.v2);}
    }
    if((op==='starts'||op==='ends')&&/[\u0600-\u06FF]/.test(f.v1)&&f.v1.length>1&&f.v1.charAt(0)==='ب'){
      const alt={col:col,op:op,v1:f.v1.slice(1),v2:''};
      if(countRows(alt)>countRows(f))f.v1=alt.v1;
    }
  }else if(col==='*')throw E('errNL');
  const err=validateFilter(f);if(err)throw E(err.key,err.params);
  return f;
}
function parseNL(q){
  let n=norm(q).replace(/[?؟!؛;]+$/,'').replace(/\.$/,'').trim();
  if(!n)throw E('errNL');
  if(CLEAR_RE.test(n))return {clear:true,filters:[]};
  n=n.replace(/\border(?:ed)? by\b/g,'sort');
  n=n.replace(/(?:between|بين)\s+(-?[\d.,\/\-]+?)\s+(?:and|to|و|الي|-)\s+(-?[\d.,\/\-]+)/g,'between $1~$2');
  n=n.replace(/(?:between|بين)\s+(-?[\d.,\/\-]+?)\s*و\s*(-?[\d.,\/\-]+)/g,'between $1~$2');
  n=n.replace(/(?:من|from)\s+(-?[\d.,\/\-]+)\s+(?:الي|to|-)\s+(-?[\d.,\/\-]+)/g,'between $1~$2');
  const segs=[{t:'f',w:[]}];
  for(const w of n.split(' ')){
    if(SORTW.has(w))segs.push({t:'s',w:[]});
    else if(GROUPW.has(w))segs.push({t:'g',w:[]});
    else segs[segs.length-1].w.push(w);
  }
  const res={filters:[],sortCol:null,sortDir:1,groupCol:null};
  let hasCmd=false;
  for(let i=1;i<segs.length;i++){
    const sg=segs[i];let w=sg.w.slice();
    while(w.length&&(w[0]==='by'||w[0]==='حسب'||w[0]==='علي'))w.shift();
    while(w.length&&(w[w.length-1]==='and'||w[w.length-1]==='و'))w.pop();
    let dir=1;
    if(sg.t==='s'&&w.length&&DIRS[w[w.length-1]]!==undefined){dir=DIRS[w.pop()];}
    const phrase=w.join(' ');
    const col=resolveColumn(phrase);
    if(col===null)throw E('errNLCol',{c:phrase,l:S.cols.join(', ')});
    if(sg.t==='s'){res.sortCol=col;res.sortDir=dir;}else res.groupCol=col;
    hasCmd=true;
  }
  let text=segs[0].w.join(' ').trim().replace(/\s+(?:and|و)$/,'');
  const noiseOnly=stripNoise(text)==='';
  if(!noiseOnly||!hasCmd){
    if(noiseOnly&&!findOp(text))throw E('errNL');
    const parts=text.split(/\s+(and|و)\s+/),clauses=[];
    for(let i=0;i<parts.length;i+=2){
      const p=parts[i];
      if(i>0&&clauses.length&&!findOp(p))clauses[clauses.length-1]+=' '+parts[i-1]+' '+p;else clauses.push(p);
    }
    let prev=null;
    for(const cl of clauses){const f=clauseToFilter(cl,prev);res.filters.push(f);prev=f.col==='*'?null:f.col;}
  }
  return res;
}
function runNL(){
  if(!S.rows.length){showMsg('errNoData',null,'err');return;}
  const q=$('nl').value.trim();
  try{
    const res=parseNL(q);
    if(res.clear){S.filters=[];S.search='';$('search').value='';S.sortCol=-1;S.groupCol=-1;syncControls();renderAll();showMsg('cleared',null,'ok');return;}
    const desc=[];
    for(const f of res.filters){S.filters.push(f);desc.push(filterPlain(f));}
    if(res.sortCol!==null){S.sortCol=res.sortCol;S.sortDir=res.sortDir;desc.push((lang==='ar'?'فرز: ':'Sort: ')+S.cols[res.sortCol]);}
    if(res.groupCol!==null){S.groupCol=res.groupCol;desc.push((lang==='ar'?'تجميع: ':'Group: ')+S.cols[res.groupCol]);}
    S.page=0;syncControls();renderAll();
    showMsg('okNL',{s:desc.join(' · ')},'ok');
  }catch(e){
    if(e&&e.key==='errNL')showMsg('errNL',{q:q},'err');
    else if(e&&e.key)showMsg(e.key,e.params,'err');
    else showMsg('errUnknown',{m:(e&&e.message)||''},'err');
  }
}

/* ======================= Statistics ======================= */
function colStats(c){
  const type=S.types[c];
  let n=0,miss=0,sum=0,min=Infinity,max=-Infinity;
  const freq=new Map(),nums=[];
  for(const r of S.view){
    if(S.miss[r][c]){miss++;continue;}
    n++;const v=S.rows[r][c];freq.set(v,(freq.get(v)||0)+1);
    const p=S.pv[r][c];
    if(type==='number'&&p!==null){sum+=p;nums.push(p);}
    if((type==='number'||type==='date')&&p!==null){if(p<min)min=p;if(p>max)max=p;}
  }
  const st={c:c,type:type,n:n,miss:miss,unique:freq.size,out:0};
  if(type==='number'&&nums.length){
    nums.sort((a,b)=>a-b);
    st.sum=sum;st.avg=sum/nums.length;st.min=nums[0];st.max=nums[nums.length-1];st.med=quantile(nums,.5);
    const q1=quantile(nums,.25),q3=quantile(nums,.75),iqr=q3-q1;
    if(iqr>0)st.out=nums.filter(x=>x<q1-1.5*iqr||x>q3+1.5*iqr).length;
  }
  if(type==='date'&&isFinite(min)){st.min=min;st.max=max;}
  st.top=Array.from(freq.entries()).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return st;
}

const PAL=['#2563eb','#16a34a','#f59e0b','#dc2626','#7c3aed','#0891b2','#db2777','#65a30d','#ea580c','#475569'];
function aggregate(idx,vc,agg){
  if(vc<0)return idx.length;
  let n=0,sum=0,mn=Infinity,mx=-Infinity;
  for(const r of idx){const p=S.pv[r][vc];if(p===null||S.miss[r][vc])continue;n++;sum+=p;if(p<mn)mn=p;if(p>mx)mx=p;}
  if(!n)return 0;
  if(agg==='sum')return sum;if(agg==='avg')return sum/n;if(agg==='min')return mn;return mx;
}
function chartGroups(c,kind,topN,vc,agg){
  const ty=S.types[c],idx=[];
  for(const r of S.view)if(!S.miss[r][c])idx.push(r);
  const notes=[];let groups=[];
  if(!idx.length)return {groups:groups,notes:notes};
  if(ty==='number'){
    const items=[];let lo=Infinity,hi=-Infinity;
    for(const r of idx){const v=S.pv[r][c];if(v===null)continue;items.push([r,v]);if(v<lo)lo=v;if(v>hi)hi=v;}
    if(!items.length)return {groups:groups,notes:notes};
    const uniq=new Set(items.map(i=>i[1])).size;
    if(kind==='hist'||uniq>15){
      if(lo===hi)groups=[{label:fmt(lo),rows:items.map(i=>i[0])}];
      else{
        const k=Math.min(20,Math.max(5,Math.ceil(Math.log2(items.length)+1))),w=(hi-lo)/k;
        for(let b=0;b<k;b++)groups.push({label:fmt(lo+b*w)+' – '+fmt(lo+(b+1)*w),rows:[]});
        for(const it of items){let b=Math.floor((it[1]-lo)/w);if(b>=k)b=k-1;groups[b].rows.push(it[0]);}
      }
      notes.push({k:'chartBins'});
    }else{
      const m=new Map();
      for(const it of items){if(!m.has(it[1]))m.set(it[1],[]);m.get(it[1]).push(it[0]);}
      groups=Array.from(m.entries()).sort((a,b)=>a[0]-b[0]).map(e=>({label:fmt(e[0]),rows:e[1]}));
    }
  }else if(ty==='date'){
    let lo=Infinity,hi=-Infinity;
    for(const r of idx){const p=S.pv[r][c];if(p===null)continue;if(p<lo)lo=p;if(p>hi)hi=p;}
    const month=(hi-lo)/864e5>62,m=new Map();
    for(const r of idx){const p=S.pv[r][c];if(p===null)continue;const key=fmtDate(p).slice(0,month?7:10);if(!m.has(key))m.set(key,[]);m.get(key).push(r);}
    groups=Array.from(m.entries()).sort((a,b)=>a[0]<b[0]?-1:1).map(e=>({label:e[0],rows:e[1]}));
  }else{
    if(kind==='hist')notes.push({k:'chartHistFb'});
    const m=new Map();
    for(const r of idx){const key=S.nr[r][c];if(!m.has(key))m.set(key,{label:S.rows[r][c],rows:[]});m.get(key).rows.push(r);}
    groups=Array.from(m.values());
    if(vc>=0)groups.sort((a,b)=>aggregate(b.rows,vc,agg)-aggregate(a.rows,vc,agg));
    else groups.sort((a,b)=>b.rows.length-a.rows.length);
    if(groups.length>topN){notes.push({k:'chartTop',p:{n:topN,m:groups.length}});groups=groups.slice(0,topN);}
  }
  return {groups:groups,notes:notes};
}
function drawChart(){
  const note=$('chartNote'),box=$('chartBox');
  note.textContent='';
  if(S.chart){S.chart.destroy();S.chart=null;}
  if(typeof Chart==='undefined'){box.hidden=true;note.textContent=t('chartMissing');return;}
  if(!S.cols.length||!S.view.length){box.hidden=true;note.textContent=t('chartNoData');return;}
  const c=+$('chCol').value,ct=$('chType').value,agg=$('chAgg').value,topN=+$('chTop').value||10;
  const vc=$('chVal').value==='count'?-1:+$('chVal').value;
  if(isNaN(c)){box.hidden=true;return;}
  const g=chartGroups(c,ct,topN,vc,agg);
  if(!g.groups.length){box.hidden=true;note.textContent=t('chartNoData');return;}
  box.hidden=false;
  const labels=g.groups.map(x=>x.label),data=g.groups.map(x=>aggregate(x.rows,vc,agg));

  const pie=(ct==='pie'||ct==='doughnut'),isAr=lang==='ar';
  const ds={label:dsLabel,data:data,
    backgroundColor:pie?labels.map((_,i)=>PAL[i%PAL.length]):(ct==='line'?PAL[0]+'33':PAL[0]+'cc'),
    borderColor:pie?'#ffffff':PAL[0],borderWidth:pie?2:(ct==='line'?2:1),tension:.25,fill:false,pointRadius:labels.length>60?0:3};
  if(ct==='hist'){ds.categoryPercentage=1;ds.barPercentage=1;}

  if(!pie)opts.scales={y:{beginAtZero:true,ticks:{callback:function(v){return fmt(v);}}},x:{ticks:{autoSkip:true,maxRotation:60}}};

  }catch(e){box.hidden=true;note.textContent=t('errUnknown',{m:e.message});return;}
  note.textContent=g.notes.map(n=>t(n.k,n.p)).join(' ');
}

function renderGroup(){
  const card=$('groupCard');
  if(S.groupCol<0||!S.rows.length){card.hidden=true;return;}
  card.hidden=false;
  const c=S.groupCol,m=S.groupMeasure,map=new Map();
  for(const r of S.view){
    const key=S.miss[r][c]?'':S.nr[r][c];
    let g=map.get(key);
    if(!g){g={label:S.miss[r][c]?t('emptyVal'):S.rows[r][c],count:0,n:0,sum:0,min:Infinity,max:-Infinity};map.set(key,g);}

  }
  const arr=Array.from(map.values()).sort((a,b)=>b.count-a.count);
  const LIM=200,total=S.view.length||1;
  let h='<thead><tr><th>'+esc(S.cols[c])+'</th><th>'+esc(t('gCount'))+'</th><th>'+esc(t('gPct'))+'</th>'+(m>=0?'<th>'+esc(t('gSum'))+'</th><th>'+esc(t('gAvg'))+'</th><th>'+esc(t('gMin'))+'</th><th>'+esc(t('gMax'))+'</th>':'')+'</tr></thead><tbody>';
  for(const g of arr.slice(0,LIM)){
    h+='<tr><td dir="auto"><bdi>'+esc(g.label)+'</bdi></td><td class="num">'+fmt(g.count)+'</td><td class="num">'+fmt(g.count/total*100)+'%</td>'+
      (m>=0?'<td class="num">'+fmt(g.sum)+'</td><td class="num">'+(g.n?fmt(g.sum/g.n):'—')+'</td><td class="num">'+(g.n?fmt(g.min):'—')+'</td><td class="num">'+(g.n?fmt(g.max):'—')+'</td>':'')+'</tr>';
  }
  $('groupTable').innerHTML=h+'</tbody>';
  const parts=[];
  if(m>=0)parts.push(t('gMeasure')+': '+S.cols[m]);
  if(arr.length>LIM)parts.push(t('gLimit',{n:LIM}));
  $('gNote').textContent=parts.join(' — ');
}
function renderAll(){

function analyze(text){
  try{
    const ds=buildDataset(text);
    applyDataset(ds);
    $('app').hidden=false;
    renderAll();
    showMsg('okLoaded',{r:fmt(ds.rows.length),c:ds.cols.length},'ok',ds.warn);
  }catch(e){
    if(e&&e.key)showMsg(e.key,e.params,'err');
    else showMsg('errUnknown',{m:(e&&e.message)||''},'err');
  }
}
async function handleFile(file){
  if(!file)return;
  if(!/\.(csv|tsv|txt|tab)$/i.test(file.name)&&!/^text\//.test(file.type)){showMsg('errFileType',{n:file.name},'err');return;}
  try{
    const buf=await file.arrayBuffer(),u=new Uint8Array(buf);
    if(!u.length){showMsg('errEmpty',null,'err');return;}
    if(u[0]===0x50&&u[1]===0x4B){showMsg('errBinary',null,'err');return;}
    let text;
    if(u[0]===0xFF&&u[1]===0xFE){text=new TextDecoder('utf-16le').decode(buf);}
    else if(u[0]===0xFE&&u[1]===0xFF){text=new TextDecoder('utf-16be').decode(buf);}
    else{
      try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf);}
      catch(e1){try{text=new TextDecoder('windows-1256').decode(buf);}catch(e2){showMsg('errCorrupt',null,'err');return;}}
    }
    $('raw').value=text;
    analyze(text);
  }catch(e){showMsg('errFileRead',null,'err');}
}
function addFilterFromUI(){
  if(!S.rows.length){showMsg('errNoData',null,'err');return;}
  const cv=$('fCol').value,col=cv==='*'?'*':+cv;
  const f={col:col,op:$('fOp').value,v1:$('fV1').value.trim(),v2:$('fV2').value.trim()};
  const err=validateFilter(f);
  if(err){showMsg(err.key,err.params,'err');return;}
  S.filters.push(f);S.page=0;
  $('fV1').value='';$('fV2').value='';
  showMsg(null);renderAll();
}
function exportCSV(){
  if(!S.view.length){showMsg('noRows',null,'warn');return;}
  const q=v=>{v=String(v);return /[",;\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const lines=[S.cols.map(q).join(',')];
  for(const r of S.view)lines.push(S.rows[r].map(q).join(','));
  const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='results.csv';document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1500);
}
function clearAll(){

}
